        <h1>Friend</h1>
        
        <div class="poem-body">I stumbled over your eyes.
They wouldn’t let me be unseeing,
They demanded to know
About me and my being.

Then I saw into those eyes
And held their challenge
Between my fingertips
On the way to my soul.
</div>
