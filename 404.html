<!DOCTYPE html>
<html lang="en">
<head>
  <load src="partials/head.html" />  
  <title>Page Not Found — Upside Down</title>
  <script>
    if (!window.location.pathname.endsWith('/404.html')) {
      const pathParts = window.location.pathname.split('/');
      const baseDepth = window.location.hostname.endsWith('github.io') ? 2 : 1;
      const basePath = pathParts.slice(0, baseDepth).join('/') + '/';
      window.location.replace(basePath + '404.html');
    }
  </script>
</head>
<body>
  <!-- Or swap this header with your vite-plugin-html-inject <load> partial -->
  <header class="site-header">

  <a href="./index.html" class="home-link site-title">
    <img src="./favicon-32x32.png" alt="Home">
    <span>Upside Down</span>
  </a>

  <nav class="site-nav">
    <a href="./dedication.html">Dedication</a>
    <a href="./toc.html">Table of Contents</a>
    <a href="./about.html">About</a>
  </nav>
  </header>

  <main class="book-intro">
    <article class="poem-container">
      <picture>
        <!-- Tall portrait version for narrow screens -->
        <source media="(max-width: 600px)" srcset="/images/404-portrait.webp" />
        <!-- Wide landscape version for wider screens -->
        <img
          src="images/404-landscape.webp"
          alt="An open vintage poetry book reading 404 Page Not Found: It seems the page you're looking for has turned upside down and gone missing."
          class="not-found-art"
        />
      </picture>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; 2008–2026 Ernest R. Shifflett</p>
  </footer>
</body>
</html>
